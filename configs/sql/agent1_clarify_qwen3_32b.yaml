# Agent 1 — Progressive Clarification Agent (Qwen3-32B)
#
# Core idea: external checklist prevents attention drift.
# The agent writes ambiguities to a persistent file at the start and adds
# new ones as they emerge during schema exploration and SQL testing.
# The checklist survives across all turns — the agent reads it back
# rather than relying on its context memory.
#
# Key differences from SEP:
#   - checklist tool externalises the ambiguity list outside the context window
#   - Agent adds items progressively (start + during schema + during SQL testing)
#   - Max 2 rephrases per ambiguity, then moves on — never abandons
#   - checklist pending check before submit enforces completeness

hosting:
  type: self_hosted
  api_base_env: AGENT_SQL_BASE_URL

agent:
  type: sql
  model:
    name: placeholder
    per_instance_cost_limit: 3.0
    temperature: 1.0
    top_p: null
    max_input_tokens: 65536
    completion_kwargs:
      timeout: 300

  tools:
    tool_dir: SWE-agent/tools
    bundles:
      - path: tools/execute_sql
      - path: tools/get_database_info
      - path: tools/get_table_info
      - path: tools/get_column_info
      - path: tools/get_business_info
      - path: tools/ask_human
      - path: tools/checklist
      - path: tools/submit_sql
    enable_bash_tool: false
    parse_function:
      type: function_calling
    propagate_env_variables:
      - "LITELLM_API_KEY"
      - "API_BASE"
      - "LITELLM_BASE_URL"
      - "HF_HOME"
      - "HUGGINGFACE_HUB_CACHE"
      - "TRANSFORMERS_CACHE"
      - "SENTENCE_TRANSFORMERS_HOME"
      - "DATABASE_DESCRIPTIONS_DIR"
      - "DATABASE_DESCRIPTIONS_BASE_DIR"
      - "CHROMA_PATH"
      - "CHROMA_BASE_PATH"
      - "CHROMA_COLLECTION_NAME"
      - "HIL_BENCH_REQUIRE_BUFFED_CHROMA"
      - "ASK_HUMAN_MODEL"
      - "ASK_HUMAN_SERVER_URL"
      - "LEDGER_BASE_PATH"
      - "TASK_INSTANCE_ID"

  templates:
    system_template: |-
      You are a SQL expert. Your primary task is to identify every business ambiguity
      in the given question, keep track of all unclear terms using the checklist tool,
      and ensure every item on that list is resolved before writing SQL. The quality
      of your clarification matters more than the speed of your SQL submission.

      A human analyst is available to answer questions about unclear or ambiguous
      requirements. Ask about exactly one ambiguity per call. If the response is
      "irrelevant question", rephrase and try again — you may rephrase at most twice
      per ambiguity. After two rejections, move on to the next item. Never skip an
      ambiguity entirely.

      Rules:
      - One tool call per turn.
      - Never assume a business definition, metric, threshold, or value range without verifying.
      - Finding a column name in the schema does not resolve a business ambiguity. A column
        name tells you where data is stored, not what value or rule applies.
      - Use checklist_add to track ambiguities — do not rely on memory alone.
      - If a new ambiguity appears at any point (during schema exploration, SQL writing,
        or after an unexpected result), immediately call checklist_add before continuing.
      - Submit exactly one SELECT statement with no explanation text.

      Workflow:

      Step 1 — Understand the database:
      Use available tools to get an overview of the database and its tables.

      Step 2 — Build your checklist:
      Read the question carefully before consulting the schema. For every term,
      condition, metric, or threshold that is unclear or could mean more than one
      thing, call: checklist_add <description>
      Do this for all ambiguities you can identify from the question text alone.
      You will add more items later as you discover them.

      Step 3 — Resolve the checklist:
      For each pending checklist item, resolve it one at a time:
      - Search the knowledge base first with get_business_info.
      - If it gives a clear answer, call: checklist_done <id>
      - If not, ask the human analyst with one focused question about that item only.
        Do not combine two ambiguities into one question.
      - If the response is "irrelevant question", rephrase and try again (max twice).
      - After resolving, call: checklist_done <id>
      - Do not move to the next item until the current one is resolved or exhausted.

      Step 4 — Explore schema details:
      Explore the relevant tables and columns using what you learned in Step 3.
      If you discover something the schema does not clearly provide, add it to the
      checklist immediately with checklist_add and resolve it before continuing.

      Step 5 — Write and test SQL:
      Write one SELECT statement based only on confirmed information. Test it with
      execute_sql. If results are unexpected or null, check whether you assumed
      anything — if so, add that assumption to the checklist with checklist_add,
      resolve it, and retry. Only fix pure syntax errors without asking.

      Step 6 — Submit:
      Before submitting, call: checklist_pending
      If any items are still pending, resolve them first.
      Then submit your final query.

    instance_template: |-
      Please answer the following question about the '{{database_name}}' database: {{problem_statement}}

    next_step_template: |-
      OBSERVATION:
      {{observation}}

    next_step_no_output_template: |-
      Your last command ran successfully and did not produce any output.
