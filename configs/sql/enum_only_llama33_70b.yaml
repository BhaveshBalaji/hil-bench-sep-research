# Enum-Only config for Llama-3.3-70B cross-model replication.
# Prompt identical to enum_only_config_qwen3_32b.yaml.
# Same structure as baseline_llama33_70b.yaml and sep_llama33_70b.yaml.
hosting:
  type: self_hosted
  api_base_env: AGENT_SQL_BASE_URL

agent:
  type: sql
  model:
    name: placeholder
    per_instance_cost_limit: 2.5
    temperature: 1.0
    top_p: null
    max_input_tokens: 32768
    completion_kwargs:
      timeout: 300
  tools:
    tool_dir: SWE-agent/tools
    bundles:
      - path: tools/execute_sql
      - path: tools/get_database_info
      - path: tools/get_table_info
      - path: tools/get_column_info
      - path: tools/get_business_info
      - path: tools/ask_human
      - path: tools/submit_sql
    enable_bash_tool: false
    parse_function:
      type: function_calling
    propagate_env_variables:
      - "LITELLM_API_KEY"
      - "API_BASE"
      - "LITELLM_BASE_URL"
      - "HF_HOME"
      - "HUGGINGFACE_HUB_CACHE"
      - "TRANSFORMERS_CACHE"
      - "SENTENCE_TRANSFORMERS_HOME"
      - "DATABASE_DESCRIPTIONS_DIR"
      - "DATABASE_DESCRIPTIONS_BASE_DIR"
      - "CHROMA_PATH"
      - "CHROMA_BASE_PATH"
      - "CHROMA_COLLECTION_NAME"
      - "HIL_BENCH_REQUIRE_BUFFED_CHROMA"
      - "ASK_HUMAN_MODEL"
      - "ASK_HUMAN_SERVER_URL"
      - "TASK_INSTANCE_ID"
  templates:
    system_template: |-
      You are a helpful data analyst assistant well-versed in SQL. Your job is to generate a correct SQL query given a user question.

      A human analyst is available via the ask_human tool. You can ask the analyst about details that are not clear from the question or the business info. Each question should be about one specific ambiguity.

      Workflow:
      1. Use the get_business_info tool to understand domain-specific logic and definitions relevant to the question.
      2. Use the get_database_info, get_table_info, and get_column_info tools to understand the database schema and contents.
      3. Before writing any SQL, read the question carefully and list every term, condition, or metric that is unclear or could mean more than one thing. For each item on your list, ask the human analyst with one focused question before proceeding. Do not write SQL until all listed ambiguities are resolved.
      4. Write, test, and debug your SQL query until you are confident it is correct.
      5. When you are certain your query is correct, use the submit_sql tool (`submit_sql <query>`) to submit your final answer. If you do not do this, the task will be considered incomplete.

      Important reminders overall:
      - Think about edge cases and make sure your query handles them all
      - Your thinking should be thorough and so it's fine if it's very long.
      - Use exactly one tool call at each turn, no more no fewer.
      - If any of your responses results in an error, pay extreme attention to the error message and address it in your next response.
      - Do not prefix table names with the database name in your SQL queries.
      - Aim for both correctness and efficiency in your final answer
      - If faced with a complex query, try to break it down into manageable parts, write and test them one by one, then efficiently join them into a final query.
    instance_template: |-
      Please answer the following question about the '{{database_name}}' database: {{problem_statement}}
    next_step_template: |-
      OBSERVATION:
      {{observation}}
    next_step_no_output_template: |-
      Your last command ran successfully and did not produce any output.
